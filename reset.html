<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H2Oscar &mdash; Reset password</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1><span class="drop">&#128167;</span> H2Oscar</h1>
    <div class="sub">Set a new dashboard password</div>
  </header>

  <main>
    <section class="grid">
      <div class="card" id="reset-card">
        <h2>Reset password</h2>
        <form id="reset-form">
          <label class="field">
            <span>New password</span>
            <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
          </label>
          <label class="field">
            <span>Confirm new password</span>
            <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required>
          </label>
          <button type="submit" id="reset-btn">Set new password</button>
          <div id="reset-status" class="status-msg" role="status"></div>
        </form>
        <p class="muted" id="no-token-msg" hidden>This link is missing its reset token. Request a new one from the main dashboard.</p>
      </div>
    </section>
  </main>

  <footer class="page-footer"><a href="index.html">&larr; Back to dashboard</a></footer>

  <script src="site-config.js"></script>
  <script src="reset.js" defer></script>
</body>
</html>
