<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H2Oscar</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
  <svg class="waterline-bg" viewBox="0 0 600 130" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,65 C100,25 200,95 300,60 C400,25 500,95 600,60 L600,130 L0,130 Z" fill="#1c7fa6"/>
  </svg>
  <header class="page-header">
    <span class="page-header-spacer" aria-hidden="true"></span>
    <h1><span class="drop">&#128167;</span> H2Oscar</h1>
    <button type="button" id="settings-gear" class="gear-btn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
        <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
      </svg>
    </button>
  </header>

  <main>
    <section id="tanks" class="tanks-row" aria-label="Tank levels"></section>
  </main>

  <footer class="page-footer">Last update: <span id="lastUpdate">never</span></footer>

  <!-- Password gate: shown first when opening Settings this session -->
  <div id="gate-backdrop" class="modal-backdrop" hidden>
    <div class="card modal">
      <button type="button" class="modal-close" data-close="gate-backdrop" aria-label="Close">&times;</button>
      <h2>Enter password</h2>
      <form id="gate-form">
        <label class="field">
          <span>Dashboard password</span>
          <input type="password" id="gate-password" autocomplete="current-password" required>
        </label>
        <button type="submit" id="gate-btn">Unlock</button>
        <div id="gate-status" class="status-msg" role="status"></div>
      </form>

      <button type="button" id="forgot-link" class="link-btn">Forgot password?</button>

      <form id="forgot-form" hidden>
        <label class="field">
          <span>Your email</span>
          <input type="email" id="forgot-email" autocomplete="email" required>
        </label>
        <button type="submit" id="forgot-btn">Send reset link</button>
        <div id="forgot-status" class="status-msg" role="status"></div>
      </form>
    </div>
  </div>

  <!-- Settings panel: shown once the password above is verified -->
  <div id="settings-backdrop" class="modal-backdrop" hidden>
    <div class="card modal modal-wide">
      <button type="button" class="modal-close" data-close="settings-backdrop" aria-label="Close">&times;</button>
      <h2>Settings</h2>
      <p class="muted">
        Sensor Outlet = distance from the sensor down to the outlet pipe (0% full).<br>
        Sensor Overflow = distance from the sensor down to the overflow pipe (100% full).
      </p>
      <div id="tank-settings-list"></div>

      <form id="password-form">
        <h3>Change password</h3>
        <label class="field">
          <span>New password</span>
          <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="field">
          <span>Confirm new password</span>
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit" id="password-btn">Update password</button>
        <div id="password-status" class="status-msg" role="status"></div>
      </form>

      <p class="muted more-settings-note">More controls are coming soon.</p>
    </div>
  </div>

  <script src="site-config.js"></script>
  <script src="app.js?v=10" defer></script>
  <!-- Bump both ?v= numbers above whenever style.css/app.js change -- GitHub
       Pages serves them with a 10-minute cache (max-age=600), so without a
       cache-busting query param returning visitors can keep running stale
       JS/CSS for up to that long after a deploy. -->
</body>
</html>
