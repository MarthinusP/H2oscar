<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H2Oscar</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1><span class="drop">&#128167;</span> H2Oscar</h1>
    <button type="button" id="settings-gear" class="gear-btn" aria-label="Settings" title="Settings">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.5v2.4M12 19.1v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/>
      </svg>
    </button>
  </header>

  <main>
    <section id="tanks" class="tanks-row" aria-label="Tank levels"></section>
  </main>

  <footer class="page-footer">Last update: <span id="lastUpdate">never</span></footer>

  <!-- Password gate: shown first when opening Settings this session -->
  <div id="gate-backdrop" class="modal-backdrop" hidden>
    <div class="card modal">
      <button type="button" class="modal-close" data-close="gate-backdrop" aria-label="Close">&times;</button>
      <h2>Enter password</h2>
      <form id="gate-form">
        <label class="field">
          <span>Dashboard password</span>
          <input type="password" id="gate-password" autocomplete="current-password" required>
        </label>
        <button type="submit" id="gate-btn">Unlock</button>
        <div id="gate-status" class="status-msg" role="status"></div>
      </form>

      <button type="button" id="forgot-link" class="link-btn">Forgot password?</button>

      <form id="forgot-form" hidden>
        <label class="field">
          <span>Your email</span>
          <input type="email" id="forgot-email" autocomplete="email" required>
        </label>
        <button type="submit" id="forgot-btn">Send reset link</button>
        <div id="forgot-status" class="status-msg" role="status"></div>
      </form>
    </div>
  </div>

  <!-- Settings panel: shown once the password above is verified -->
  <div id="settings-backdrop" class="modal-backdrop" hidden>
    <div class="card modal">
      <button type="button" class="modal-close" data-close="settings-backdrop" aria-label="Close">&times;</button>
      <h2>Settings</h2>
      <p class="muted">
        Sensor Outlet = distance from the sensor down to the outlet pipe (0% full).<br>
        Sensor Overflow = distance from the sensor down to the overflow pipe (100% full).
      </p>
      <div id="tank-settings-list"></div>

      <form id="password-form">
        <h3>Change password</h3>
        <label class="field">
          <span>New password</span>
          <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
        </label>
        <label class="field">
          <span>Confirm new password</span>
          <input type="password" id="confirm-password" autocomplete="new-password" minlength="8" required>
        </label>
        <button type="submit" id="password-btn">Update password</button>
        <div id="password-status" class="status-msg" role="status"></div>
      </form>

      <p class="muted more-settings-note">More controls are coming soon.</p>
    </div>
  </div>

  <script src="site-config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
