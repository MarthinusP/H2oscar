<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H2Oscar</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1><span class="drop">&#128167;</span> H2Oscar</h1>
    <div class="sub"><span id="dot" class="status-dot"></span><span id="connLabel">Connecting&hellip;</span></div>
  </header>

  <main>
    <section id="tanks" class="tanks-grid" aria-label="Tank levels"></section>

    <section class="grid">
      <div class="card" id="calibration-card">
        <h2>Calibration &mdash; Tank 1</h2>
        <p class="muted">
          Sensor Outlet = the distance from the sensor down to the outlet pipe (0% full).<br>
          Sensor Overflow = the distance from the sensor down to the overflow pipe (100% full).
        </p>
        <form id="cal-form">
          <label class="field">
            <span>Sensor Outlet (mm)</span>
            <input type="number" id="outlet-mm" min="20" max="4500" required>
          </label>
          <label class="field">
            <span>Sensor Overflow (mm)</span>
            <input type="number" id="overflow-mm" min="20" max="4500" required>
          </label>
          <label class="field">
            <span>Dashboard password</span>
            <input type="password" id="dash-password" autocomplete="current-password">
          </label>
          <label class="remember">
            <input type="checkbox" id="remember-password">
            Remember password on this device
          </label>
          <button type="submit" id="save-btn">Save calibration</button>
          <div id="cal-status" class="status-msg" role="status"></div>
        </form>

        <button type="button" id="forgot-link" class="link-btn">Forgot password?</button>

        <form id="forgot-form" hidden>
          <label class="field">
            <span>Your email</span>
            <input type="email" id="forgot-email" autocomplete="email" required>
          </label>
          <button type="submit" id="forgot-btn">Send reset link</button>
          <div id="forgot-status" class="status-msg" role="status"></div>
        </form>
      </div>

      <div class="card" id="more-settings-card">
        <h2>More settings</h2>
        <p class="muted">More controls are coming soon.</p>
      </div>
    </section>
  </main>

  <footer class="page-footer">Last update: <span id="lastUpdate">never</span></footer>

  <script src="site-config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
